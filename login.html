<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Painel de Gestão</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#141B3C; --blue:#4157F0; --bg:#F4F5F9; --surface:#FFFFFF;
    --ink:#181C2E; --slate:#6B7280; --line:#EAEBF1; --red:#E5484D; --red-soft:#FBE5E4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif; background:var(--navy);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
  }
  .card{
    background:var(--surface); border-radius:16px; padding:36px 32px;
    width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .logo{ display:flex; justify-content:center; margin-bottom:22px; }
  .logo img{ height:34px; width:auto; }
  h1{ font-size:18px; margin:0 0 4px; text-align:center; color:var(--ink); }
  .sub{ font-size:13.5px; color:var(--slate); text-align:center; margin:0 0 26px; }
  label{ font-size:13px; font-weight:600; color:var(--ink); display:block; margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--bg); color:var(--ink);
  }
  input:focus{ outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
  button{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--blue);
    color:#fff; font-weight:600; font-size:14.5px; cursor:pointer; margin-top:6px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .error{
    background:var(--red-soft); color:var(--red); border-radius:8px; padding:10px 12px;
    font-size:13px; margin-bottom:16px; display:none;
  }
  .error.show{ display:block; }
  .spinner{
    width:15px; height:15px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><img src="logo_full.png" alt="ATEJ"></div>
  <h1>Entrar no painel</h1>
  <p class="sub">Acesso restrito — fale com o administrador para receber seu login.</p>

  <div class="error" id="error-box"></div>

  <form id="login-form" autocomplete="on">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="username" required placeholder="voce@email.com">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="password" autocomplete="current-password" required placeholder="••••••••">
    </div>
    <button type="submit" id="btn-entrar">
      <span class="spinner" id="spinner"></span>
      <span id="btn-label">Entrar</span>
    </button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // se já estiver logado, vai direto pro painel
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.replace('index.html');
  });

  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const btn = document.getElementById('btn-entrar');
  const spinner = document.getElementById('spinner');
  const btnLabel = document.getElementById('btn-label');

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    btn.disabled = true; spinner.classList.add('show'); btnLabel.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;

    const { error } = await sb.auth.signInWithPassword({ email, password: senha });

    if (error) {
      showError('E-mail ou senha incorretos.');
      btn.disabled = false; spinner.classList.remove('show'); btnLabel.textContent = 'Entrar';
      return;
    }

    window.location.replace('index.html');
  });
</script>
</body>
</html>
